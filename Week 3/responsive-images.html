<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images</title>

    <link rel="stylesheet" href="styles/responsive-images.css">
</head>
<body>
    <main>
        <div class="temple">
            <picture>
                <source srcset="images/mexico-temple-large.webp" media="(min-width: 1000px )">
                <source srcset="images/mexico-temple-midium.webp" media="(min-width: 500px)">
                <img src="images/mexico-temple-small.webp" alt="Mexico City Temple" width="500" height="250">
            </picture>
        </div>
    </main>
</body>
</html>
