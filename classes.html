<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driving School</title>
    <meta name="author" content="Roosvelth Vazquez">
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals This iis my first
        time taking this course, this goin to to awesome">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/classes.css">
    <script src="scripts/classes.js" defer></script>
</head>

<body>
    <!-- Header -->
    <header>
        <p class="tittle">Driving School</p>
        <img class="img" src="images/wheel-car.svg" width="60px" alt="incon">
        <button id="menu"></button>
        <nav>
            <ul class="navigation">
                <li><a href="siteplan.html">Home</a></li>
                <li><a href="siteplan.html#about-us">About Us</a></li>
                <li><a href="gallery.html">Gallery</a></li>
            </ul>
        </nav>
    </header>
    <!-- Main -->
    <main>
    
        <!-- Packages -->
        <section>
            <h1>Our Packages</h1>
            <div id="packages-container" class="grid"></div>
        </section>
    
        <!-- Instructors -->
        <section class="instructores">
            <h2>Meet Our Instructors</h2>
            <div id="instructors-container" class="grid2"></div>
        </section>
    
        <!-- Form -->
        <section>
            <h2>Enroll Now</h2>
        
            <form id="enrollForm">
        
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required>
                </div>
        
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
        
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>
        
                <div class="form-group">
                    <label for="packageSelect">Select Package</label>
                    <select id="packageSelect" required>
                        <option value="">Select a Package</option>
                    </select>
                </div>
        
                <div class="form-group">
                    <label for="document">Upload ID (optional)</label>
                    <input type="file" id="document">
                </div>
        
                <input type="submit" name="submit" id="submit" value="Send Enrrollment">
            </form>
        
            <p id="message"></p>
        </section>

    
    </main>

    <!-- Footer -->
    <footer>
        <h2>Contact Information</h2>
        <p>📍 Mexico City</p>
        <p>📞 (555) 123-4567</p>
        <p>📧 info@drivingschool.com</p>
    </footer>
    
    </body>
    
    </html>
