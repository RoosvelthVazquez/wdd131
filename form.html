<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Roosvelth Vazquez">
    <meta name="description" content="WDD 131 – Dynamic Web Fundamentals, Here we are to write 
    a form to demostrate our knowledge during this course.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
     rel="stylesheet">

     <link rel="stylesheet" href="styles/form.css">
     <script src="scripts/form.js" defer></script>
</head>
<body>
    <header><h1>Product Review</h1></header>

    <main>
        <form method="get" action="review.html">
            <!-- Product name -->
            <div class="product">
                <label for="product">Name*</label>
                    <select name="product" id="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
            </div>

            <!-- Overall Rating -->
             <div>Overall Rating*</div>
            <div class="overall-rating">
                <label for="star1"><input type="radio" id="star1" name="star" value="star1" required>☆</label>
                <label for="star2"><input type="radio" id="star2" name="star" value="star2" required>☆☆</label>
                <label for="star3"><input type="radio" id="star3" name="star" value="star3" required>☆☆☆</label>
                <label for="star4"><input type="radio" id="star4" name="star" value="star4" required>☆☆☆☆</label>
                <label for="star5"><input type="radio" id="star5" name="star" value="star5" required>☆☆☆☆☆</label>
            </div>

            <!-- Date of installation -->
            <div>
                <label for="date">Date of installation*<input type="date" id="date" name="date" required></label>
            </div>
            <!-- Useful Features -->
             <div class="useful-features">
                <p>Which features did you find useful in the product?</p>
                <p class="cursive">(check all the apply)</p>
                <label for="Durabillity"><input type="checkbox" id="Durabillity" name="Durabillity" value="Durabillity">Durabillity</label>
                <label for="Ease-of-use"><input type="checkbox" id="Ease-of-use" name="Ease-of-use" value="">Ease of use</label>
                <label for="Performance"><input type="checkbox" id="Performance" name="Performance" value="">Performance</label>
                <label for="Dseing"><input type="checkbox" id="Dseing" name="Dseing" value="">Desing</label>
             </div>
            <!-- Written Review -->
             <div class="r-review">
                <label for="r-review">Written Review</label>
                <textarea name="r-review" id="r-review"></textarea>                
             </div>

             <!-- User's name -->
             <div class="name">
                <label for="name">Name</label>
                <input type="text" id="name" name="name">
             </div>

             <input class="butttom" type="submit" value="Send my product review">

        </form>
        <div class="div">
            <p><span class="contador">Number of visits:</span>
            <span class="numVisits"></span></p>
        </div>
    </main>

    <footer>
        <p class="year">©<span id="currentyear"></span> 🍕 Roosvelth Arturo Vazquez Bautista 🍕 Mexico</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
